<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner 2027 · Feliz Vida</title>
<meta name="theme-color" content="#1159C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner 2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Open+Sans:wght@400;600;700&family=Dancing+Script:wght@600;700&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1159C4; --blue-d:#0B3F8F; --blue-l:#4FA8E0; --sky:#9ED3F2; --mist:#EEF1F5; --paper:#fff;
  --ink:#2A2F38; --ink-2:#5B6472; --line:#D9DEE6; --soft:#F6F8FB;
  --sb:270px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mist);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
aside{width:var(--sb);flex:0 0 var(--sb);background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px 40px}
.brand{font-family:Montserrat;font-weight:900;letter-spacing:.18em;color:var(--blue);font-size:13px;text-align:center;line-height:1.35;padding:0 6px 4px}
.brand .script{font-family:Sacramento;letter-spacing:0;font-weight:400;color:#6b6f76;font-size:30px;display:block;margin-top:-2px}
.brand .yr{display:block;font-size:22px;letter-spacing:.08em;margin-top:2px}
.save{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11.5px;color:var(--ink-2);margin:10px 0 14px}
.save i{width:8px;height:8px;border-radius:50%;background:#B0BEC5;display:inline-block}
.save.ok i{background:#2E9E6A}.save.busy i{background:#F0A63A}.save.local i{background:#4FA8E0}.save.err i{background:#D64545}
.today-btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px;font-family:Montserrat;font-weight:700;font-size:13px;margin-bottom:16px}
.today-btn:hover{background:var(--blue-d)}
nav .grp{font-family:Montserrat;font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:18px 8px 6px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:8px;font-size:13.5px}
nav a:hover{background:var(--soft)}
nav a.on{background:#E6EFFC;color:var(--blue-d);font-weight:700}
nav a .pg{font-size:10.5px;color:var(--ink-2);font-weight:600;min-width:34px;text-align:right}
nav a .bar{height:3px;border-radius:3px;background:var(--line);width:34px;overflow:hidden;flex:0 0 34px}
nav a .bar b{display:block;height:100%;background:var(--blue-l)}
nav .months{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 4px}
nav .months a{justify-content:center;padding:7px 0;font-size:12.5px;position:relative}
nav .months a .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);height:2px;border-radius:2px;background:var(--blue-l)}
main{flex:1;min-width:0;padding:28px 28px 80px}
.page{max-width:880px;margin:0 auto}
.menu-btn{display:none}
@media (max-width:900px){
  aside{position:fixed;z-index:50;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  aside.open{transform:none}
  .menu-btn{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;background:#fff;border:0;border-bottom:1px solid var(--line);width:100%;padding:12px 16px;font-family:Montserrat;font-weight:800;color:var(--blue);letter-spacing:.1em;font-size:12px}
  main{padding:16px 12px 80px}
  .scrim{position:fixed;inset:0;background:rgba(10,20,40,.3);z-index:45;display:none}
  .scrim.on{display:block}
}
/* ---------- paper ---------- */
.sheet{background:var(--paper);border-radius:18px;box-shadow:0 1px 2px rgba(20,40,80,.05),0 8px 30px rgba(20,40,80,.06);padding:40px 48px;margin-bottom:22px;position:relative;overflow:hidden}
@media (max-width:600px){.sheet{padding:26px 20px}}
.hero{position:relative;background:linear-gradient(160deg,#F7F8FA,#E9ECF1);border-radius:18px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 24px;margin-bottom:22px;overflow:hidden}
.hero .stars{position:absolute;inset:0;pointer-events:none}
.hero h1{position:relative;font-family:Montserrat;font-weight:900;color:var(--blue);font-size:clamp(28px,4.6vw,44px);letter-spacing:.04em;line-height:1.08;margin:0;text-transform:uppercase}
.hero .kicker{position:relative;font-family:Montserrat;font-weight:900;color:var(--blue);font-size:clamp(30px,5vw,48px);margin-bottom:6px}
.hero .sub{position:relative;margin-top:14px;color:var(--ink-2);max-width:560px}
.hero .script{position:relative;font-family:"Dancing Script";font-weight:700;color:var(--blue-d);font-size:clamp(38px,6vw,58px);line-height:1;margin-top:18px}
.hero .quote{position:relative;font-family:Montserrat;font-weight:800;color:var(--blue);text-transform:uppercase;font-size:clamp(14px,2vw,18px);max-width:560px;margin-top:22px;line-height:1.3}
.hero .quote small{display:block;font-size:11px;letter-spacing:.06em;margin-top:6px}
.intro p{margin:0 0 12px}
.intro .center{text-align:center;font-weight:700;color:var(--blue-d)}
h2.sec{font-family:Montserrat;font-weight:800;color:var(--blue);font-size:19px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:0}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.q{margin:0 0 22px}
.q label,.q .lbl{display:block;font-weight:600;margin-bottom:8px;color:var(--ink)}
.q .lbl b,.q label b{color:var(--blue);font-family:Montserrat;font-weight:800;margin-right:4px}
.hint{font-size:12.5px;color:var(--ink-2);margin:-4px 0 8px}
textarea,input[type=text],input[type=date],input[type=number],input[type=email],input[type=password]{width:100%;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);transition:border-color .15s,background .15s;outline:none}
textarea{resize:vertical;min-height:72px;line-height:1.6;background-image:repeating-linear-gradient(transparent,transparent 23px,#E4E8EF 23px,#E4E8EF 24px);background-attachment:local;background-position:0 10px}
textarea:focus,input:focus{border-color:var(--blue-l);background-color:#fff}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row .n{font-family:Montserrat;font-weight:800;color:var(--blue);width:22px;flex:0 0 22px;text-align:right}
.row input[type=date]{width:170px;flex:0 0 170px}
@media (max-width:600px){.row{flex-wrap:wrap}.row input[type=date]{flex:1 1 100%;margin-left:32px}}
.scale{display:flex;flex-wrap:wrap;gap:6px}
.scale button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-family:Montserrat;font-weight:700;color:var(--ink-2)}
.scale button:hover{border-color:var(--blue-l)}
.scale button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip{display:inline-flex;gap:6px}
.chip button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;color:var(--ink-2)}
.chip button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h4{margin:0 0 8px;font-family:Montserrat;font-weight:800;color:var(--blue);font-size:14px}
.card textarea{background-color:#fff}
.mantra{background:linear-gradient(135deg,#E8F1FD,#F5F9FF);border-left:4px solid var(--blue);border-radius:12px;padding:18px 22px;font-style:italic;color:var(--blue-d);margin:16px 0;text-align:right;font-weight:600}
.banner{font-family:Montserrat;font-weight:900;text-transform:uppercase;color:var(--blue);text-align:center;font-size:clamp(18px,3vw,26px);line-height:1.2;padding:30px 10px;letter-spacing:.03em}
.btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13.5px}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue-l)}
.btn.danger{background:#fff;color:#C23B3B;border:1.5px solid #F0CACA}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.pager a{flex:1;text-decoration:none;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 2px rgba(20,40,80,.05);color:var(--ink)}
.pager a small{display:block;color:var(--ink-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.pager a b{font-family:Montserrat;color:var(--blue)}
.pager a.nx{text-align:right}
/* roda */
.roda{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:center}
@media (max-width:800px){.roda{grid-template-columns:1fr}}
.step{margin-bottom:14px}
.step .t{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.step .t span{font-family:Montserrat;color:var(--blue)}
.step .d{font-size:12px;color:var(--ink-2);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--blue)}
/* financeiro */
table.fin{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.fin th{font-family:Montserrat;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--blue);padding:10px;text-align:left}
table.fin th:first-child{border-top-left-radius:10px}table.fin th:last-child{border-top-right-radius:10px}
table.fin td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
table.fin td.p{font-family:Montserrat;font-weight:800;color:var(--blue);font-size:12px;width:120px;background:var(--soft)}
table.fin td.p small{display:block;font-weight:600;color:var(--ink-2);font-family:"Open Sans"}
table.fin input{background:#fff;padding:7px 9px}
.tot{text-align:right;font-family:Montserrat;font-weight:800;color:var(--blue-d);margin-top:10px}
/* sonhos */
.dreams{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.dream{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
.dream .img{aspect-ratio:4/3;background:var(--soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.dream input{border:0;border-top:1px solid var(--line);border-radius:0;background:#fff;font-weight:600}
.dream .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#C23B3B;font-weight:800;display:none}
.dream:hover .x{display:block}
@media (hover:none){.dream .x{display:block}}
.dream.add{border:2px dashed var(--line);align-items:center;justify-content:center;min-height:190px;color:var(--ink-2);gap:10px;padding:16px;text-align:center}
/* carta */
.envelope{text-align:center;padding:40px 10px}
.envelope svg{width:140px;height:auto}
/* month */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:13px;text-align:center}
.cal .h{font-family:Montserrat;font-weight:800;font-size:10.5px;color:var(--ink-2);letter-spacing:.08em;padding:4px 0}
.cal a{display:block;padding:8px 0;border-radius:8px;text-decoration:none;color:var(--ink);background:var(--soft);position:relative}
.cal a:hover{background:#E6EFFC}
.cal a.wk{color:var(--ink-2)}
.cal a.hol{background:#FFF1E6;color:#B4561B;font-weight:700}
.cal a.today{outline:2px solid var(--blue);font-weight:800}
.cal a .m{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%}
.hols{font-size:12.5px;color:var(--ink-2);margin-top:10px}
.hols b{color:#B4561B}
.week h3{font-family:"Dancing Script";font-weight:700;color:var(--blue);font-size:34px;margin:0 0 2px;text-align:center}
.week .range{text-align:center;color:var(--ink-2);font-size:12.5px;margin-bottom:18px;font-family:Montserrat;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;padding:14px 0;border-top:1px solid var(--line);scroll-margin-top:70px}
.day:first-of-type{border-top:0}
.day.is-today{background:linear-gradient(90deg,#EEF5FF,transparent);border-radius:12px;padding-left:10px;padding-right:10px}
@media (max-width:760px){.day{grid-template-columns:1fr}}
.day .dt{font-family:Montserrat;font-weight:800;color:var(--blue);font-size:13px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day .dt .tag{font-family:"Open Sans";font-weight:700;font-size:11px;background:#FFF1E6;color:#B4561B;border-radius:999px;padding:1px 8px}
.day .dt .tg2{background:#E6EFFC;color:var(--blue-d)}
.day textarea{min-height:52px}
.mini-l{font-family:Montserrat;font-weight:800;font-size:10.5px;letter-spacing:.1em;color:var(--blue);text-transform:uppercase;margin:2px 0 4px}
.icons{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.icons button{width:38px;height:38px;border-radius:10px;border:1.5px solid transparent;background:var(--soft);display:flex;align-items:center;justify-content:center;color:#6A7383;padding:0}
.icons button:hover{border-color:var(--sky)}
.icons button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.icons svg{width:24px;height:24px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* listas */
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:28px minmax(0,1fr) auto 30px;gap:8px;align-items:center}
.li input[type=text]{padding:8px 10px}
.li.done input[type=text]{text-decoration:line-through;color:var(--ink-2)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--sky);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.ck.on{background:var(--blue);border-color:var(--blue)}
.rate{display:flex}
.rate button{border:0;background:none;padding:0 1px;font-size:16px;color:#D3D9E2}
.rate button.on{color:#F2B33D}
.del{border:0;background:none;color:#B9C0CC;font-size:18px;padding:0}
.del:hover{color:#C23B3B}
/* ano */
.heat{display:grid;grid-template-columns:44px repeat(31,1fr);gap:3px;font-size:10px}
.heat .ml{font-family:Montserrat;font-weight:800;color:var(--ink-2);display:flex;align-items:center}
.heat .c{aspect-ratio:1;border-radius:3px;background:#EEF1F5}
.heat .c.x{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:Montserrat;font-weight:900;font-size:28px;color:var(--blue)}
.stat span{font-size:12.5px;color:var(--ink-2)}
.prog{height:8px;border-radius:8px;background:var(--mist);overflow:hidden;margin-top:6px}
.prog b{display:block;height:100%;background:linear-gradient(90deg,var(--blue-l),var(--blue))}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:24px;max-width:440px;width:100%}
.modal h3{margin:0 0 8px;font-family:Montserrat;color:var(--blue)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:120}
.toast.on{opacity:1}
.cover-name{position:relative;font-family:Montserrat;font-weight:900;color:var(--blue);font-size:clamp(26px,4vw,38px);line-height:1;margin-top:20px}
.cover-yr{position:relative;font-family:Montserrat;font-weight:800;color:#6b6f76;font-size:26px;letter-spacing:.06em;margin-top:6px}
.cover-t{position:relative;font-family:Montserrat;font-weight:900;color:var(--blue);font-size:clamp(28px,5vw,46px);letter-spacing:.28em;line-height:1.18;text-indent:.28em}
.cover-s{position:relative;font-family:Sacramento;color:#6b6f76;font-size:clamp(54px,9vw,86px);line-height:.9;margin-top:-4px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.toc a{text-decoration:none;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink)}
.toc a:hover{border-color:var(--blue-l);background:#fff}
.toc a small{display:block;font-family:Montserrat;font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-l)}
.toc a b{font-family:Montserrat;color:var(--blue-d)}
.auth{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,#F7F8FA,#E3E8EF);display:none;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.auth.on{display:flex}
.auth .box{position:relative;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(20,40,80,.12);padding:32px 28px;max-width:380px;width:100%;text-align:center}
.auth input{margin-bottom:10px;background-image:none}
.auth .err{color:#C23B3B;font-size:13px;min-height:18px;margin:4px 0 8px}
.auth .link{background:none;border:0;color:var(--ink-2);font-size:12.5px;text-decoration:underline;margin-top:12px}
.acct{font-size:11.5px;color:var(--ink-2);text-align:center;margin:-6px 0 12px;word-break:break-all}
.acct button{background:none;border:0;color:var(--blue);font-size:11.5px;text-decoration:underline;padding:0 0 0 4px}
.install{display:none;width:100%;background:#fff;color:var(--blue);border:1.5px solid var(--line);border-radius:10px;padding:8px;font-weight:700;font-size:12.5px;margin:-8px 0 16px}
.install.on{display:block}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue-l),var(--blue));animation:ld 1.2s infinite;z-index:200}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
</style>
</head>
<body>
<div class="loading" id="loading"></div>
<div class="app">
  <aside id="side">
    <div class="brand">MEU PLANNER PARA UMA<span class="script">feliz vida</span><span class="yr">2027</span></div>
    <div class="save" id="save"><i></i><span>Preparando…</span></div>
    <div class="acct" id="acct"></div>
    <button class="today-btn" id="todayBtn">Ir para hoje</button>
    <button class="install" id="installBtn">⬇ Instalar o app neste aparelho</button>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <button class="menu-btn" id="menuBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>MENU · PLANNER 2027</button>
    <div class="page" id="page"></div>
  </main>
</div>
<div class="auth" id="auth"><svg class="stars" id="authStars" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"></svg><form class="box" id="authForm">
  <div class="brand" style="font-size:12px">MEU PLANNER PARA UMA<span class="script">feliz vida</span><span class="yr">2027</span></div>
  <p style="color:var(--ink-2);font-size:13.5px;margin:12px 0 16px" id="authMsg">Entre para sincronizar seu planner em todos os aparelhos.</p>
  <input type="email" id="authEmail" placeholder="Seu e-mail" autocomplete="email" required>
  <input type="password" id="authPass" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password" required minlength="6">
  <div class="err" id="authErr"></div>

function stars(seed,corners){const r=rng(seed);let s='';const cols=['#1E78C8','#4FA8E0','#9ED3F2','#2C5E9E','#7FC4EC','#B9C7D6'];

    s+=`<path d="${starPath(x,y,.5+r()*1.7)}" fill="${cols[Math.floor(r()*cols.length)]}" opacity="${(.45+r()*.55).toFixed(2)}"/>`}});

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}

/* ============ state & storage ============ */
const S={};             // doc -> {field:value}
const T={};             // doc -> last local change (ms)

function g(doc,f){return (S[doc]||{})[f]}
function setv(doc,f,v){(S[doc]=S[doc]||{})[f]=v;T[doc]=Date.now();markDirty(doc)}
function loadLocal(){try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'));Object.assign(T,JSON.parse(localStorage.getItem(LST)||'{}'));JSON.parse(localStorage.getItem(LSQ)||'[]').forEach(k=>dirty.add(k))}catch(e){}}

  try{localStorage.setItem(LST,JSON.stringify(T));localStorage.setItem(LSQ,JSON.stringify([...dirty]))}catch(e){}}
const dirty=new Set();let saveT=null,flushing=false;
function status(cls,txt){const e=$('#save');e.className='save '+cls;e.querySelector('span').textContent=txt}
function idleStatus(){if(mode!=='cloud')status('local','Salvo neste aparelho');else if(!navigator.onLine)status('local',dirty.size?'Offline · sincroniza quando voltar a internet':'Offline · tudo salvo no aparelho');else status('ok','Tudo sincronizado')}
function markDirty(doc){dirty.add(doc);T[doc]=Date.now();status('busy','Salvando…');clearTimeout(saveT);saveT=setTimeout(flush,800)}
async function flush(){saveLocal();
  if(mode!=='cloud'||!session||!navigator.onLine||flushing){if(!flushing)idleStatus();return}
  flushing=true;const keys=[...dirty];dirty.clear();let err=null;
  try{
    const ups=keys.filter(k=>S[k]!==null&&S[k]!==undefined).map(k=>({user_id:session.user.id,key:k,data:S[k],updated_at:new Date(T[k]||Date.now()).toISOString()}));
    const dels=keys.filter(k=>S[k]===null);
    if(ups.length){const r=await sb.from('planner_docs').upsert(ups,{onConflict:'user_id,key'});if(r.error)throw r.error}
    for(const k of dels){const r=await sb.from('planner_docs').delete().eq('key',k);if(r.error)throw r.error;delete S[k];delete T[k]}
  }catch(e){err=e;keys.forEach(k=>dirty.add(k));console.warn('sync',e)}
  flushing=false;saveLocal();
  if(dirty.size&&!err){clearTimeout(saveT);saveT=setTimeout(flush,500)}
  else if(err){status('err','Não sincronizou — tento de novo em instantes');clearTimeout(saveT);saveT=setTimeout(flush,15000)}
  else idleStatus()}
async function pull(){if(mode!=='cloud'||!session||!navigator.onLine)return false;
  const r=await sb.from('planner_docs').select('key,data,updated_at');if(r.error){console.warn(r.error);return false}
  let changed=false;const remote=new Set();
  r.data.forEach(row=>{remote.add(row.key);const rt=Date.parse(row.updated_at);
    if(dirty.has(row.key)&&(T[row.key]||0)>=rt)return;
    if(!T[row.key]||rt>T[row.key]){S[row.key]=row.data;T[row.key]=rt;changed=true}else if(rt<T[row.key])dirty.add(row.key)});
  Object.keys(S).forEach(k=>{if(!remote.has(k)&&S[k])dirty.add(k)});
  saveLocal();if(dirty.size)flush();return changed}

function rodaSVG(){const cx=160,cy=160,R=140,n=7;let s='';
  for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n,v=+(g('retro','roda'+(i+1))||0);
    const arc=(r)=>{const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`};
    s+=`<path d="${arc(R)}" fill="${RODA[i][2]}" opacity=".08" stroke="#fff" stroke-width="2"/>`;
    if(v>0)s+=`<path d="${arc(R*v/10)}" fill="${RODA[i][2]}" opacity=".85" stroke="#fff" stroke-width="2"/>`;
    const am=(a0+a1)/2;s+=`<text x="${(cx+(R+12)*Math.cos(am)).toFixed(1)}" y="${(cy+(R+12)*Math.sin(am)+4).toFixed(1)}" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="12" fill="${RODA[i][2]}">${i+1}º</text>`}
  for(let k=2;k<=10;k+=2)s+=`<circle cx="${cx}" cy="${cy}" r="${R*k/10}" fill="none" stroke="#C9D2DE" stroke-width="${k===10?1.4:.6}" stroke-dasharray="${k===10?'':'2 3'}"/>`;
  const vals=RODA.map((_,i)=>+(g('retro','roda'+(i+1))||0)),cnt=vals.filter(v=>v>0).length,avg=cnt?(vals.reduce((a,b)=>a+b,0)/n).toFixed(1):'–';
  s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="#fff"/><text x="${cx}" y="${cy+2}" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="17" fill="#1159C4">${avg}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="8.5" fill="#5B6472">média</text>`;
  return `<svg viewBox="-14 -14 348 348" width="100%" id="rodaSvg">${s}</svg>`}

const pageEl=$('#page');
pageEl.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f){setv(D,t.dataset.f,t.value);if(t.tagName==='TEXTAREA')autosize(t);
   if(t.dataset.roda){$('#rv'+t.dataset.roda).textContent=t.value;$('#rodaBox').innerHTML=rodaSVG()}
   if(/^fin_/.test(t.dataset.f)&&$('#finTot'))$('#finTot').textContent=finTotal();
   refreshNav();return}
 if(t.dataset.dream){const items=g('sonhos','items')||[];const it=items.find(x=>x.id===t.dataset.dream);if(it){it.t=t.value;setv('sonhos','items',items)}return}
 if(t.dataset.litem!==undefined){const a=g('listas',LTAB.t)||[];a[+t.dataset.litem].t=t.value;setv('listas',LTAB.t,a)}
});
pageEl.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.pick){const f=b.dataset.pick,v=b.dataset.v,cur=g(D,f);setv(D,f,String(cur)===v?'':v);
   if(b.classList.contains('ck')){const on=String(cur)!==v;b.classList.toggle('on',on);b.textContent=on?'✓':''}else b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b&&String(cur)!==v));
   if(f==='s1foco'||/_h$/.test(f)){refreshNav(); if(/_h$/.test(f)){const cal=document.querySelector('.cal');if(cal){const d=+f.slice(1,3);const a=cal.querySelector(`[data-goday="${d}"]`);if(a){let m=a.querySelector('.m');const mc=MOOD.find(x=>x[0]===g(D,f));if(mc){if(!m){m=document.createElement('span');m.className='m';a.appendChild(m)}m.style.background=mc[2]}else if(m)m.remove()}}}}
   else refreshNav();return}
 if(b.dataset.goday){e.preventDefault();if(b.dataset.gom!==undefined){const m=+b.dataset.gom;WEEKTAB[m]=weekOf(m,+b.dataset.goday);location.hash=MES_ID[m];setTimeout(()=>goDay(+b.dataset.goday),60);return}
   const p=P.find(x=>x.id===curId);WEEKTAB[p.month]=weekOf(p.month,+b.dataset.goday);rerender();goDay(+b.dataset.goday);return}
 if(b.dataset.wtab!==undefined){const p=P.find(x=>x.id===curId);WEEKTAB[p.month]=b.dataset.wtab;rerender();const w=$('#wtabs');if(w)w.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(b.dataset.ltab){LTAB.t=b.dataset.ltab;rerender();return}
 if(b.dataset.mode){setv('prefs','retroMode',b.dataset.mode);rerender();refreshNav();return}
 if(b.dataset.lck!==undefined){const a=g('listas',LTAB.t)||[];a[+b.dataset.lck].d=!a[+b.dataset.lck].d;setv('listas',LTAB.t,a);rerender();return}
 if(b.dataset.lrate!==undefined){const a=g('listas',LTAB.t)||[];const it=a[+b.dataset.lrate],v=+b.dataset.v;it.r=it.r===v?0:v;setv('listas',LTAB.t,a);rerender();return}
 if(b.dataset.ldel!==undefined){const a=g('listas',LTAB.t)||[];a.splice(+b.dataset.ldel,1);setv('listas',LTAB.t,a);rerender();return}
 if(b.id==='addDream'){$('#fileIn').value='';ask('Novo sonho',`<p style="margin:0 0 12px;color:var(--ink-2)">Quer colocar uma foto?</p>`,[['Escolher foto',()=>$('#fileIn').click()],['Só texto',()=>addDream(null)]]);return}
 if(b.dataset.deldream){const id=b.dataset.deldream;ask('Remover este sonho?','',[['Remover',()=>{const items=(g('sonhos','items')||[]).filter(x=>x.id!==id);setv('sonhos','items',items);if(S['img-'+id]){S['img-'+id]=null;markDirty('img-'+id)}rerender()}],['Cancelar',null]]);return}
 const act=b.dataset.act;if(!act)return;
 if(act==='seal'){if(!(g('carta','texto')||'').trim()){toast('Escreva sua carta antes de lacrar 💙');return}setv('carta','sealed',true);setv('carta','peek',false);rerender();toast('Carta lacrada até dezembro de 2027 ✉')}
 if(act==='unseal'){setv('carta','sealed',false);rerender()}
 if(act==='peek'){ask('Abrir a carta antes da hora?','<p style="margin:0 0 12px;color:var(--ink-2)">A ideia é lê-la só em dezembro de 2027. Tem certeza?</p>',[['Abrir mesmo assim',()=>{setv('carta','peek',true);rerender()}],['Deixar lacrada',null]])}
 if(act==='download'){downloadBackup();toast('Backup baixado!')}
 if(act==='copy'){const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('Dados copiados! Cole em um arquivo de texto para guardar.'),()=>toast('Não consegui copiar automaticamente.'))}
 if(act==='import'){ask('Restaurar de uma cópia','<p style="margin:0 0 8px;color:var(--ink-2)">Escolha o arquivo de backup ou cole o texto copiado. O que estiver nele substitui o conteúdo atual.</p><input type="file" id="impF" accept=".json,application/json" style="margin-bottom:8px"><textarea id="impT" rows="5" style="background-image:none"></textarea>',[['Restaurar',()=>{try{let o=JSON.parse($('#impT').value);if(o&&o.app==='planner2027')o=o.S;for(const k in o){S[k]=o[k];T[k]=Date.now();dirty.add(k)}flush();rerender();toast('Planner restaurado!')}catch(e){toast('Texto inválido — confira se copiou tudo.')}}],['Cancelar',null]],true);const fi=$('#impF');if(fi)fi.onchange=()=>{const f=fi.files[0];if(f)f.text().then(t=>{$('#impT').value=t})}}
});
pageEl.addEventListener('submit',e=>{if(e.target.id==='laddf'){e.preventDefault();const v=$('#ladd').value.trim();if(!v)return;const a=(g('listas',LTAB.t)||[]).slice();a.push({t:v,d:false,r:0});setv('listas',LTAB.t,a);rerender();setTimeout(()=>{const x=$('#ladd');if(x)x.focus()},0)}});
function weekOf(m,d){return String(monthWeeks(m).findIndex(w=>w.includes(d)))}
function goDay(d){const el=document.getElementById('dia-'+d);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});const t=el.querySelector('textarea');if(t)setTimeout(()=>t.focus({preventScroll:true}),400)}}
$('#todayBtn').onclick=()=>{if(NOW.getFullYear()!==YEAR){if(NOW<new Date(YEAR,0,1)){location.hash='recapitular';toast('2027 ainda não começou — que tal a retrospectiva de 2026?')}else location.hash='meu-ano';return}const m=NOW.getMonth(),d=NOW.getDate();WEEKTAB[m]=weekOf(m,d);if(location.hash==='#'+MES_ID[m])rerender();else location.hash=MES_ID[m];setTimeout(()=>goDay(d),80)};
$('#menuBtn').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('on')};
$('#scrim').onclick=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('on')};
function ask(title,body,btns,keepOpen){const mb=$('#modalBox');mb.innerHTML=`<h3>${title}</h3>${body}<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px">${btns.map((b,i)=>`<button class="btn ${i?'ghost':''}" data-mi="${i}">${b[0]}</button>`).join('')}</div>`;$('#modal').classList.add('on');
 mb.querySelectorAll('[data-mi]').forEach(x=>x.onclick=()=>{const fn=btns[+x.dataset.mi][1];$('#modal').classList.remove('on');if(fn)fn()})}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')});
function addDream(src){const id='s'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);const items=(g('sonhos','items')||[]).slice();items.push({id,t:''});if(src){S['img-'+id]={src};markDirty('img-'+id)}setv('sonhos','items',items);rerender();setTimeout(()=>{const x=document.querySelector(`[data-dream="${id}"]`);if(x)x.focus()},50)}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=720,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);addDream(c.toDataURL('image/jpeg',.78))};img.onerror=()=>toast('Não consegui abrir essa imagem.');img.src=r.result};r.readAsDataURL(f)});

/* ============ backup download ============ */
function downloadBackup(){const blob=new Blob([JSON.stringify({app:'planner2027',saved:new Date().toISOString(),S,T})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='planner-2027-backup-'+todayKey+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ============ auth ============ */
let signup=false;
function showAuth(on){$('#auth').classList.toggle('on',on);if(on){const r=rng(9);let st='';for(let i=0;i<70;i++){const x=r()*100,y=r()*100;if(x>25&&x<75&&y>20&&y<80)continue;st+=`<path d="${starPath(x,y,.5+r()*1.6)}" fill="${['#1E78C8','#4FA8E0','#9ED3F2','#B9C7D6'][Math.floor(r()*4)]}" opacity=".7"/>`}$('#authStars').innerHTML=st}}
function acctLine(){const e=$('#acct');if(mode==='cloud'&&session)e.innerHTML=`${esc(session.user.email)} <button id="logout">sair</button>`;else if(sb)e.innerHTML=`Só neste aparelho <button id="login">entrar para sincronizar</button>`;else e.textContent='';
  const lo=$('#logout');if(lo)lo.onclick=()=>ask('Sair da conta?','<p style="margin:0 0 12px;color:var(--ink-2)">Seus dados continuam na nuvem. Neste aparelho, o planner fica vazio até você entrar de novo.</p>',[['Sair',async()=>{await flush();await sb.auth.signOut();for(const k in S)delete S[k];for(const k in T)delete T[k];dirty.clear();try{localStorage.removeItem(LS);localStorage.removeItem(LST);localStorage.removeItem(LSQ);localStorage.removeItem(LSM)}catch(e){}location.reload()}],['Cancelar',null]]);
  const li=$('#login');if(li)li.onclick=()=>showAuth(true)}
$('#authToggle').onclick=()=>{signup=!signup;$('#authGo').textContent=signup?'Criar conta':'Entrar';$('#authToggle').textContent=signup?'Já tenho conta · entrar':'Primeira vez? Criar minha conta';$('#authPass').autocomplete=signup?'new-password':'current-password';$('#authErr').textContent=''};
$('#authLocal').onclick=()=>{try{localStorage.setItem(LSM,'local')}catch(e){}mode='local';showAuth(false);acctLine();idleStatus()};
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('#authEmail').value.trim(),password=$('#authPass').value;$('#authErr').textContent='';$('#authGo').disabled=true;$('#authGo').textContent='Aguarde…';
  try{const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
    if(r.error)throw r.error;
    if(!r.data.session){$('#authErr').style.color='var(--blue-d)';$('#authErr').textContent='Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.';signup=false}
  }catch(err){const m=String(err.message||err);$('#authErr').style.color='';$('#authErr').textContent=/Invalid login/i.test(m)?'E-mail ou senha incorretos.':/already registered/i.test(m)?'Este e-mail já tem conta — use Entrar.':/fetch|network/i.test(m)?'Sem conexão com a internet.':m}
  $('#authGo').disabled=false;$('#authGo').textContent=signup?'Criar conta':'Entrar'});
async function onSession(sess){session=sess;if(sess){mode='cloud';try{localStorage.removeItem(LSM)}catch(e){}showAuth(false);acctLine();status('busy','Sincronizando…');await pull();idleStatus();rerender()}else acctLine()}

/* ============ install (PWA) ============ */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installBtn').classList.add('on')});
$('#installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#installBtn').classList.remove('on')};
window.addEventListener('appinstalled',()=>{$('#installBtn').classList.remove('on');toast('App instalado! 💙')});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ============ boot ============ */
loadLocal();route(false);idleStatus();
(async()=>{
 if(CFG.url&&CFG.key&&window.supabase){
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_IN'&&(!session||session.user.id!==sess.user.id))onSession(sess);else if(sess)session=sess});
  let localPref=null;try{localPref=localStorage.getItem(LSM)}catch(e){}
  if(data.session)await onSession(data.session);
  else{acctLine();if(localPref!=='local')showAuth(true)}
 }
 const l=$('#loading');if(l)l.remove();
})();
})();
</script>
</body>
</html>
